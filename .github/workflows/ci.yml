name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-check:
    name: Rust fmt / clippy / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  android-build:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 镜像自带 Android SDK 与 sdkmanager,无需 setup-android(该 action 实测在本仓库持续失败)。
      - name: Install NDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME:?ANDROID_HOME 未设置}/cmdline-tools/latest/bin/sdkmanager")"
          [ -x "$SDKMANAGER" ] || { echo "sdkmanager 不存在: $SDKMANAGER"; exit 1; }
          echo "Using $SDKMANAGER"
          ALL_NDK=$("$SDKMANAGER" --list | grep -oE 'ndk;[0-9]+(\.[0-9]+)+' | cut -d';' -f2 | sort -uV)
          NDK_VERSION=$(echo "$ALL_NDK" | grep -E '^2[678]\.' | tail -1)
          [ -n "$NDK_VERSION" ] || NDK_VERSION=$(echo "$ALL_NDK" | tail -1)
          echo "Installing NDK ${NDK_VERSION}"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          yes | "$SDKMANAGER" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build Rust libraries (Android ABIs)
        working-directory: rust
        run: >
          cargo ndk
          -t arm64-v8a -t armeabi-v7a -t x86_64
          -o ../android/app/src/main/jniLibs
          build --release -p player-jni

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hirust-player-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
